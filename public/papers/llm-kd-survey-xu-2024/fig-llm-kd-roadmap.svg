<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">大语言模型知识蒸馏路线图</title>
  <desc id="desc">展示 LLM 知识蒸馏从老师信号、数据、训练目标到学生技能和部署的路线。</desc>
  <style>
    :root { --bg:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --muted:#52514e; --grid:#e1e0d9; --blue:#2a78d6; --aqua:#1baf7a; --yellow:#eda100; --violet:#4a3aa7; --red:#e34948; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1a1a19; --panel:#242421; --ink:#ffffff; --muted:#c3c2b7; --grid:#383835; --blue:#3987e5; --aqua:#199e70; --yellow:#c98500; --violet:#9085e9; --red:#e66767; } }
    .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--grid);stroke-width:1.5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .arrow{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  </style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--muted)"/></marker></defs>
  <rect class="bg" width="980" height="540" rx="28"/>
  <text x="490" y="48" text-anchor="middle" class="ink" font-size="28" font-weight="700">A Survey on Knowledge Distillation of LLMs</text>
  <text x="490" y="78" text-anchor="middle" class="muted" font-size="15">LLM KD = 老师信号 × 数据生成 × 训练目标 × 学生技能</text>

  <g transform="translate(60 150)">
    <rect class="panel" width="180" height="240" rx="24"/>
    <circle cx="90" cy="54" r="30" fill="var(--blue)" opacity="0.18"/>
    <text x="90" y="61" text-anchor="middle" class="ink" font-size="21" font-weight="700">Teacher</text>
    <text x="90" y="106" text-anchor="middle" class="muted" font-size="13">large / API / expert</text>
    <text x="28" y="150" class="muted" font-size="13">answers</text>
    <text x="28" y="178" class="muted" font-size="13">logits / logprobs</text>
    <text x="28" y="206" class="muted" font-size="13">rationales</text>
  </g>

  <g transform="translate(300 124)">
    <rect class="panel" width="180" height="112" rx="22"/>
    <circle cx="28" cy="32" r="10" fill="var(--aqua)"/>
    <text x="48" y="38" class="ink" font-size="18" font-weight="700">Data</text>
    <text x="28" y="70" class="muted" font-size="13">synthetic instructions</text>
    <text x="28" y="92" class="muted" font-size="13">filter · augment</text>
  </g>
  <g transform="translate(300 304)">
    <rect class="panel" width="180" height="112" rx="22"/>
    <circle cx="28" cy="32" r="10" fill="var(--yellow)"/>
    <text x="48" y="38" class="ink" font-size="18" font-weight="700">Objective</text>
    <text x="28" y="70" class="muted" font-size="13">SFT · KL · DPO</text>
    <text x="28" y="92" class="muted" font-size="13">OPD · rewards</text>
  </g>

  <g transform="translate(560 126)">
    <rect class="panel" width="180" height="110" rx="22"/>
    <circle cx="28" cy="31" r="10" fill="var(--violet)"/>
    <text x="48" y="37" class="ink" font-size="18" font-weight="700">Skills</text>
    <text x="28" y="69" class="muted" font-size="13">reasoning · coding</text>
    <text x="28" y="91" class="muted" font-size="13">tool use · alignment</text>
  </g>
  <g transform="translate(560 304)">
    <rect class="panel" width="180" height="112" rx="22"/>
    <circle cx="28" cy="32" r="10" fill="var(--red)"/>
    <text x="48" y="38" class="ink" font-size="18" font-weight="700">Risks</text>
    <text x="28" y="70" class="muted" font-size="13">hallucination</text>
    <text x="28" y="92" class="muted" font-size="13">style ≠ ability</text>
  </g>

  <g transform="translate(800 150)">
    <rect class="panel" width="130" height="240" rx="24"/>
    <circle cx="65" cy="54" r="30" fill="var(--aqua)" opacity="0.18"/>
    <text x="65" y="61" text-anchor="middle" class="ink" font-size="21" font-weight="700">Student</text>
    <text x="65" y="106" text-anchor="middle" class="muted" font-size="13">small / specialized</text>
    <text x="65" y="154" text-anchor="middle" class="muted" font-size="13">deployable</text>
    <text x="65" y="184" text-anchor="middle" class="muted" font-size="13">aligned</text>
    <text x="65" y="214" text-anchor="middle" class="muted" font-size="13">domain-ready</text>
  </g>

  <path class="arrow" marker-end="url(#arr)" d="M240 250 C270 210 276 185 300 180"/>
  <path class="arrow" marker-end="url(#arr)" d="M240 290 C270 330 276 360 300 360"/>
  <path class="arrow" marker-end="url(#arr)" d="M480 180 C512 170 532 170 560 180"/>
  <path class="arrow" marker-end="url(#arr)" d="M480 360 C512 350 532 350 560 360"/>
  <path class="arrow" marker-end="url(#arr)" d="M740 180 C770 210 782 230 800 250"/>
  <path class="arrow" marker-end="url(#arr)" d="M740 360 C770 330 782 300 800 290"/>
  <path class="arrow" marker-end="url(#arr)" d="M390 236 L390 304"/>
  <path class="arrow" marker-end="url(#arr)" d="M650 236 L650 304"/>
</svg>
