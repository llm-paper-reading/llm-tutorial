<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 的 Agent Loop</title>
  <desc id="desc">收集上下文、采取行动、验证结果三阶段循环，直到出现无工具调用的纯文本响应；护栏为 max_turns 与 max_budget_usd。</desc>
  <rect width="960" height="480" fill="#fafafa"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Claude Code 的 Agent Loop：gather → act → verify</text>

  <defs>
    <marker id="arrLoop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- 三阶段 -->
  <rect x="80" y="90" width="230" height="100" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="195" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#065f46">① 收集上下文</text>
  <text x="195" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">gather context</text>
  <text x="195" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#047857">只读工具并发执行</text>

  <rect x="365" y="90" width="230" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">② 采取行动</text>
  <text x="480" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">take action</text>
  <text x="480" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#2563eb">写状态工具串行执行</text>

  <rect x="650" y="90" width="230" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="765" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">③ 验证结果</text>
  <text x="765" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b45309">verify results</text>
  <text x="765" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">测试 / 构建 / 截图对比</text>

  <line x1="312" y1="140" x2="363" y2="140" stroke="#0f766e" stroke-width="3" marker-end="url(#arrLoop)"/>
  <line x1="597" y1="140" x2="648" y2="140" stroke="#0f766e" stroke-width="3" marker-end="url(#arrLoop)"/>

  <!-- 回环 -->
  <path d="M765 192 C765 260 195 260 195 194" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrLoop)"/>
  <text x="480" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#0f766e">未完成 → 继续循环（三阶段相互交融，用户随时可打断：Esc / 排队消息 / steering 纠偏）</text>

  <!-- 终止条件 -->
  <rect x="170" y="290" width="620" height="66" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">终止：出现无工具调用的纯文本响应 → 返回 ResultMessage</text>
  <text x="480" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">（含 token 用量、成本、session_id）</text>

  <!-- 护栏 -->
  <rect x="170" y="386" width="620" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">护栏：预算即护栏</text>
  <text x="480" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#b91c1c">max_turns（工具轮数上限）· max_budget_usd（花费上限）</text>
</svg>
