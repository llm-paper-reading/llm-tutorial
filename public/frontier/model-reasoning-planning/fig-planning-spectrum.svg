<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">规划策略谱系</title>
  <desc id="desc">四种规划策略沿环境不确定性与动作空间规模排布：先规划后执行、交错推理-行动、搜索式、世界模型前瞻；早承诺换连贯，延迟承诺换稳健。</desc>
  <rect width="960" height="350" fill="#fafafa"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">规划策略谱系：承诺时机沿环境不确定性排布</text>

  <defs>
    <marker id="arrSp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- 四种策略 -->
  <rect x="60" y="80" width="200" height="112" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#065f46">先规划后执行</text>
  <text x="160" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">plan-then-execute</text>
  <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#047857">一次性产出完整计划</text>
  <text x="160" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#047857">早承诺：连贯但脆弱</text>

  <rect x="290" y="80" width="200" height="112" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1d4ed8">交错推理-行动</text>
  <text x="390" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">ReAct 式</text>
  <text x="390" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#2563eb">思考 → 行动 → 观察</text>
  <text x="390" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#2563eb">边走边看，逐步修正</text>

  <rect x="520" y="80" width="200" height="112" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#92400e">搜索式</text>
  <text x="620" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b45309">MCTS · 树搜索</text>
  <text x="620" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">分支探索 + 回溯</text>
  <text x="620" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">延迟承诺：稳健但算力贵</text>

  <rect x="750" y="80" width="200" height="112" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="850" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#5b21b6">世界模型前瞻</text>
  <text x="850" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6d28d9">world-model lookahead</text>
  <text x="850" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6d28d9">先在内部模型里模拟未来</text>
  <text x="850" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6d28d9">再决定行动</text>

  <line x1="262" y1="136" x2="288" y2="136" stroke="#0f766e" stroke-width="3" marker-end="url(#arrSp)"/>
  <line x1="492" y1="136" x2="518" y2="136" stroke="#0f766e" stroke-width="3" marker-end="url(#arrSp)"/>
  <line x1="722" y1="136" x2="748" y2="136" stroke="#0f766e" stroke-width="3" marker-end="url(#arrSp)"/>

  <!-- 底部坐标轴 -->
  <defs>
    <marker id="arrAxis" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="60" y1="248" x2="940" y2="248" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrAxis)"/>
  <text x="500" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">环境不确定性与动作空间规模 →</text>
  <text x="480" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280">早承诺买全局连贯，代价是对未预见情况脆弱；延迟承诺买稳健，代价是算力与局部连贯——没有全能点，</text>
  <text x="480" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280">合适的位置取决于环境的不确定性与动作空间大小，因此领域重心正从 plan-then-execute 默认值右移</text>
</svg>
