<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">模型侧 RL 与 Harness 侧工程的分工</title>
  <desc id="desc">模型侧负责把单步推理质量与多轮工具使用做进权重；Harness 侧负责持久规划、上下文经济学、验证闭环与安全边界；两者合成编码 Agent。</desc>
  <rect width="960" height="470" fill="#fafafa"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">模型侧 RL × Harness 侧工程：两条路线的分工</text>

  <defs>
    <marker id="arrMH" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- 模型侧 -->
  <rect x="60" y="95" width="320" height="190" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#065f46">模型侧（API 训练）</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle">
    <text x="220" y="158">RLVR → Agentic RL</text>
    <text x="220" y="182">on-policy 蒸馏 · 自我改进</text>
    <text x="220" y="206">effort 分档：10 / 15 / 25 / 80 / max</text>
    <text x="220" y="234" font-size="12" font-style="italic">把单步推理质量与多轮工具使用</text>
    <text x="220" y="254" font-size="12" font-style="italic">做进权重；思考预算成为接口</text>
  </g>

  <!-- Harness 侧 -->
  <rect x="580" y="95" width="320" height="190" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="740" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Harness 侧（产品工程）</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="740" y="158">持久规划（plan tool / workflow）</text>
    <text x="740" y="182">上下文经济学（压缩 / 子代理 / 按需）</text>
    <text x="740" y="206">验证闭环（确定性检查 + 对抗审查）</text>
    <text x="740" y="230" font-size="12" font-style="italic">安全边界（沙箱 / 审批 / 网络）</text>
    <text x="740" y="254" font-size="12" font-style="italic">堵住模型做不到的四件事</text>
  </g>

  <!-- 中心 -->
  <rect x="410" y="130" width="140" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#92400e">编码 Agent</text>
  <text x="480" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#b45309">Claude Code</text>
  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#b45309">Codex</text>
  <line x1="382" y1="190" x2="406" y2="190" stroke="#0f766e" stroke-width="3" marker-end="url(#arrMH)"/>
  <line x1="578" y1="190" x2="554" y2="190" stroke="#0f766e" stroke-width="3" marker-end="url(#arrMH)"/>

  <!-- 底部注记 -->
  <rect x="130" y="330" width="700" height="100" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">两家的系统提示词主体都刻意不足 100 行</text>
  <text x="480" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#6b7280">长提示词会稀释指令遵循——复杂行为外化到工具设计（行为规范的主要载体）·</text>
  <text x="480" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#6b7280">hooks（确定性强制）· 子代理（隔离与专门化）</text>
</svg>
