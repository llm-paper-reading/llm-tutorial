<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">分层加协议的收敛架构</title>
  <desc id="desc">应用层（Claude Code/Codex/Cowork/Dify）与编排层（LangGraph/CrewAI/MAF/ADK/Mastra）之间由 A2A（agent 互操作）与 MCP（工具互操作）连接，编排层之下是可替换的模型层。</desc>
  <rect width="960" height="480" fill="#fafafa"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">「分层 + 协议」替代「统一框架」</text>

  <!-- 应用层 -->
  <rect x="120" y="70" width="720" height="72" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#065f46">应用层（面向终端场景）</text>
  <text x="480" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#047857">Claude Code · Codex · Cowork · Dify —— 按场景选择</text>

  <!-- 协议层 -->
  <rect x="120" y="196" width="345" height="64" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="292" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">A2A 协议</text>
  <text x="292" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">agent ↔ agent 互操作 · 不暴露内部状态</text>
  <rect x="495" y="196" width="345" height="64" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="667" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">MCP 协议</text>
  <text x="667" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">agent ↔ 工具 / 数据源互操作 · 事实标准</text>

  <!-- 编排层 -->
  <rect x="120" y="314" width="720" height="72" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">编排层（按技术栈与口味选择）</text>
  <text x="480" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#2563eb">LangGraph · CrewAI · MAF · ADK · Mastra —— 图工作流 + 状态持久化</text>

  <!-- 模型层 -->
  <text x="480" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">模型层（可替换）：Opus · GPT · Gemini · Qwen ……</text>

  <!-- 连接箭头 -->
  <defs>
    <marker id="arrLP" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1,1 L9,1 L5,9 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="480" y1="142" x2="480" y2="192" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrLP)" marker-start="url(#arrLP)"/>
  <line x1="480" y1="260" x2="480" y2="310" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrLP)" marker-start="url(#arrLP)"/>
  <line x1="480" y1="386" x2="480" y2="404" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 侧注 -->
  <text x="872" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">通用性由</text>
  <text x="872" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">协议层承担</text>
  <text x="480" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280">框架价值从「编排语法」降为「协议实现质量 + 运维能力」——类似 Web：没有最优框架，但 HTTP / HTML 通用</text>
</svg>
